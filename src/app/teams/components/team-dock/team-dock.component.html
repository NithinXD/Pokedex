<div class="team-dock-bar">
  <div class="team-label" style="margin-right: 24px;">
    <div style="position: relative; cursor: pointer;" title="Select Team">
      <span>TEAM : </span>
      <select class="team-select-hidden" [value]="selectedTeamName()" (change)="onTeamSelect($event)">
        <option value="" disabled selected hidden></option>
        @for (name of allTeamNames(); track name) {
        <option [value]="name">{{ name }}</option>
        }
      </select>
    </div>
    <span (click)="editTeamName()" style="cursor: pointer;" title="Edit Team Name">{{ selectedTeamName() }} <small
        style="font-size: 10px;"></small></span>
  </div>

  <div class="dock-controls">
    <button type="button" class="nav-arrow left-arrow" (click)="prevTeam.emit()"></button>

    <div class="slots-container">
      @for (idx of slots; track idx) {
      <div class="slot-circle" [class.is-empty]="!teamPokemon()[idx]" cdkDropList [id]="'dock-slot-' + idx"
        (cdkDropListDropped)="onDrop($event, idx)">
        @if (teamPokemon()[idx]; as pokemon) {
        <img [src]="getSpriteUrl(pokemon.id)" [alt]="pokemon.name" class="dock-sprite pixelated"
          (click)="removePokemon.emit(idx)" title="Click to remove" />
        }
      </div>
      }
    </div>

    <button type="button" class="nav-arrow right-arrow" (click)="nextTeam.emit()"></button>
    <button type="button" class="add-team-btn" (click)="createTeam.emit()" title="Create New Team"
      style="margin-left: 16px;">+</button>
  </div>
</div>
