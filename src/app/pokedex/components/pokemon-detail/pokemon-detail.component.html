@if (selectedPokemon()) {
  <div class="stats-inline-panel">

    <!-- Red header with Pokémon name + close -->
    <div class="stats-header">
      <span class="stats-title">{{ selectedPokemon()?.name | uppercase }}</span>
      <button class="btn-close" (click)="closePanel()" title="Back to list">✕</button>
    </div>

    <!-- White body -->
    <div class="stats-body">

      <!-- Radar chart -->
      <div class="chart-box">
        <div class="chart-label">BASE STATS</div>
        <div echarts [options]="chartOption()" class="radar-chart"></div>
      </div>

      <!-- Abilities -->
      @if (selectedPokemon()?.abilities?.length) {
        <div class="abilities-box">
          <div class="chart-label">ABILITIES</div>
          <ul class="abilities-list">
            @for (ability of selectedPokemon()!.abilities; track ability) {
              <li>{{ ability | uppercase }}</li>
            }
          </ul>
        </div>
      }

    </div>

  </div>
}
