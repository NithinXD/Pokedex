<!-- Pokédex Handheld Top Control Panel -->
<header class="pokedex-top-control-bar">
  <div class="camera-lens-container">
    <!-- Big Blue Glowing Lens — shines while cry plays -->
    <div class="big-blue-lens" [class.lens-shining]="isPlaying()">
      <div class="lens-glint"></div>
    </div>
    <!-- Three Indicator Lights — blink while cry plays -->
    <div class="indicator-lights">
      <span class="light red"   [class.blinking]="isPlaying()"></span>
      <span class="light yellow"[class.blinking]="isPlaying()"></span>
      <span class="light green" [class.blinking]="isPlaying()"></span>
    </div>
  </div>

  <div class="pokedex-title-badge">
    KANTO POKÉDEX v1.0
  </div>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
